[package]
name    = "cyrax-native"
version = "0.1.0"
edition = "2021"

[lib]
name      = "cyrax_native"
crate-type = ["cdylib"]

[dependencies]
jni          = { version = "0.21", features = ["invocation"] }
sha2         = "0.10"
hmac         = "0.12"
aes-gcm      = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rand_core    = { version = "0.6", features = ["getrandom"] }
rand         = "0.8"
libc         = "0.2"
thiserror    = "1.0"
hex          = "0.4"
lazy_static  = "1.4"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
pbkdf2       = "0.12"
bincode      = "1.3"
hkdf         = "0.12"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
