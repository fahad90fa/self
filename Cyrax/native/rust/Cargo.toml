[package]
name = "c2_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
hkdf = "0.12"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
jni = "0.21"
jni-sys = "0.3"
base64 = "0.21"
hex = "0.4"
log = "0.4"
lazy_static = "1.4"
