[package]
name = "c2_server"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
hkdf = "0.12"
dashmap = "5.5"
warp = "0.3"
prometheus = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

[[bin]]
name = "c2_server"
path = "src/c2_main.rs"

[lib]
name = "c2_lib"
path = "src/lib.rs"
