user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 100000;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=1000r/s;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;

    # ========================================================================
    # UPSTREAM BACKENDS
    # ========================================================================

    upstream c2_server {
        least_conn;
        server c2-server:8080 max_fails=3 fail_timeout=30s;
    }

    upstream panel_api {
        least_conn;
        server panel-api:3000 max_fails=3 fail_timeout=30s;
    }

    upstream fcm_relay {
        least_conn;
        server fcm-relay:8081 max_fails=3 fail_timeout=30s;
    }

    upstream prometheus {
        server prometheus:9090 max_fails=1 fail_timeout=10s;
    }

    upstream grafana {
        server grafana:3000 max_fails=1 fail_timeout=10s;
    }

    # ========================================================================
    # REDIRECT HTTP -> HTTPS
    # ========================================================================

    server {
        listen 80;
        server_name _;
        
        location / {
            return 301 https://$host$request_uri;
        }

        # ACME challenge (Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # ========================================================================
    # MAIN HTTPS SERVER
    # ========================================================================

    server {
        listen 443 ssl http2;
        server_name c2.example.com;

        # SSL configuration
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # TLS 1.3 + 1.2 only
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        # ====================================================================
        # C2 WEBSOCKET ENDPOINT (for devices)
        # ====================================================================
        location /ws {
            limit_req zone=ws burst=20 nodelay;

            proxy_pass http://c2_server;
            proxy_http_version 1.1;
            
            # WebSocket upgrades
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts (keep-alive for long-polling)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;

            # Buffering
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # ====================================================================
        # PANEL API ENDPOINTS
        # ====================================================================
        location /api {
            limit_req zone=api burst=100 nodelay;

            proxy_pass http://panel_api;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache API responses
            proxy_cache_valid 200 1m;
            proxy_cache_bypass $http_pragma $http_authorization;

            # Timeouts
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ====================================================================
        # PANEL UI (static frontend)
        # ====================================================================
        location / {
            limit_req zone=general burst=20 nodelay;

            # Serve from local static directory
            root /var/www/panel;
            try_files $uri $uri/ /index.html;

            # Cache control
            add_header Cache-Control "public, max-age=3600" always;
        }

        # ====================================================================
        # FCM RELAY WEBHOOK
        # ====================================================================
        location /fcm {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://fcm_relay;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # ====================================================================
        # HEALTH CHECK
        # ====================================================================
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }

    # ========================================================================
    # MONITORING DASHBOARD (separate port for internal use)
    # ========================================================================

    server {
        listen 8888 ssl;
        server_name c2.example.com;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Only allow from internal IPs
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;

        # Prometheus
        location /prometheus {
            proxy_pass http://prometheus;
            proxy_set_header Host $host;
        }

        # Grafana
        location /grafana {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
